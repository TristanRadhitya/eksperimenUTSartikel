<!DOCTYPE html>
<html>
<body>
  <h2>Demo HTTP Polling</h2>
  <div id="output"></div>
  <script>
    const output = document.getElementById('output');

    // Polling setiap 2 detik
    setInterval(() => {
      fetch('http://localhost:3000')
        .then(response => response.text())
        .then(data => {
          output.innerHTML += `${data}<br>`;
        });
    }, 2000);
  </script>
</body>
</html>
